<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% if page.title %}{{ page.title | escape }} | {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ '/prof_pic.jpg' | absolute_url }}">
  <meta name="twitter:card" content="summary">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3EJL%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="{{ '/assets/fonts/fonts.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="container nav">
      <a class="brand" href="{{ '/' | relative_url }}">Jonathan Yu-Meng Li</a>
      <nav aria-label="Primary"><ul>
        <li><a href="{{ '/' | relative_url }}" {% if page.nav == 'about' %}aria-current="page"{% endif %}>About</a></li>
        <li><a href="{{ '/research/' | relative_url }}" {% if page.nav == 'research' %}aria-current="page"{% endif %}>Research</a></li>
        <li><a href="{{ '/lab/' | relative_url }}" {% if page.nav == 'lab' %}aria-current="page"{% endif %}>RIO Lab</a></li>
        <li><a href="{{ '/teaching/' | relative_url }}" {% if page.nav == 'teaching' %}aria-current="page"{% endif %}>Teaching</a></li>
      </ul></nav>
    </div>
  </header>
  <main id="main" class="container" data-page="{{ page.nav }}" data-baseurl="{{ site.baseurl }}">{{ content }}</main>
  <footer class="container site-footer"><p>© <span data-year>{{ site.time | date: '%Y' }}</span> Jonathan Yu-Meng Li · Telfer School of Management, University of Ottawa</p></footer>
</body>
</html>
